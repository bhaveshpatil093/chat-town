<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Town Overlay</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import {
        Application,
        Graphics,
      } from "https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.mjs";

      const app = new Application();
      await app.init({
        resizeTo: window,
        autoDensity: true,
        resolution: window.devicePixelRatio || 1,
        backgroundAlpha: 0,
      });
      app.renderer.background.alpha = 0;
      document.body.appendChild(app.canvas);

      const townMap = [
        "gggggggggggggggggg",
        "gggTggggggggTggggg",
        "gggggggggggggggggg",
        "pppppppppppppppppp",
        "ggggggppgggggggggg",
        "gTggggppggggTggggg",
        "ggggggppgggggggggg",
        "ggggggppppppppgggg",
        "ggggggggggggppgggg",
        "ggggggggggggppgggg",
      ];
      const tileColors = {
        g: ["#69a84f", "#72b256"],
        p: ["#c59a62", "#d2a96e"],
      };
      const townGraphics = new Graphics();
      app.stage.addChild(townGraphics);

      function drawTownMap() {
        townGraphics.clear();
        const tileWidth = app.screen.width / townMap[0].length;
        const tileHeight = app.screen.height / townMap.length;

        townMap.forEach((row, rowIndex) => {
          [...row].forEach((tile, columnIndex) => {
            const x = columnIndex * tileWidth;
            const y = rowIndex * tileHeight;

            if (tile === "T") {
              townGraphics
                .rect(x, y, tileWidth + 1, tileHeight + 1)
                .fill("#69a84f");
              townGraphics
                .rect(
                  x + tileWidth * 0.16,
                  y + tileHeight * 0.08,
                  tileWidth * 0.68,
                  tileHeight * 0.58,
                )
                .fill("#27633b");
              townGraphics
                .rect(
                  x + tileWidth * 0.29,
                  y + tileHeight * 0.18,
                  tileWidth * 0.42,
                  tileHeight * 0.32,
                )
                .fill("#347947");
              townGraphics
                .rect(
                  x + tileWidth * 0.43,
                  y + tileHeight * 0.62,
                  tileWidth * 0.14,
                  tileHeight * 0.3,
                )
                .fill("#795132");
              return;
            }

            const colors = tileColors[tile === "p" ? "p" : "g"];
            const color = colors[(rowIndex + columnIndex) % colors.length];
            townGraphics.rect(x, y, tileWidth + 1, tileHeight + 1).fill(color);
          });
        });
      }

      drawTownMap();
      window.addEventListener("resize", drawTownMap);

      const initialReconnectDelayMs = 500;
      const maximumReconnectDelayMs = 30_000;
      let reconnectAttempts = 0;

      function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${protocol}//${window.location.host}`);

        socket.addEventListener("open", () => {
          reconnectAttempts = 0;
          console.info("[Chat Town overlay] WebSocket connected");
        });

        socket.addEventListener("message", (message) => {
          try {
            console.log("[Chat Town overlay] event", JSON.parse(message.data));
          } catch (error) {
            console.warn("[Chat Town overlay] received invalid JSON", error);
          }
        });

        socket.addEventListener("close", () => {
          const delay = Math.min(
            initialReconnectDelayMs * 2 ** reconnectAttempts,
            maximumReconnectDelayMs,
          );
          reconnectAttempts = Math.min(reconnectAttempts + 1, 10);
          console.warn(`[Chat Town overlay] reconnecting in ${delay}ms`);
          window.setTimeout(connect, delay);
        });

        socket.addEventListener("error", (error) => {
          console.error("[Chat Town overlay] WebSocket error", error);
          socket.close();
        });
      }

      connect();
    </script>
  </body>
</html>
