<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Town Overlay</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import {
        Application,
        Container,
        Graphics,
        Text,
      } from "https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.mjs";

      const app = new Application();
      const overlayParameters = new URLSearchParams(window.location.search);
      const requestedLabelSize = Number(overlayParameters.get("labelSize"));
      const defaultLabelFontSize = Math.round(
        Math.max(14, Math.min(22, window.innerWidth / 64)),
      );
      const labelFontSize =
        Number.isInteger(requestedLabelSize) &&
        requestedLabelSize >= 10 &&
        requestedLabelSize <= 48
          ? requestedLabelSize
          : defaultLabelFontSize;
      const characterCap = readIntegerParameter("characterCap", 150, 1, 1000);
      const RAID_PARADE_TIMELINE = {
        bannerEnterMs: 650,
        marcherDelayMs: 450,
        marcherStaggerMs: 85,
        marchSpeedTilesPerSecond: 3.5,
        disperseMs: 500,
      };
      const MAX_RAID_MARCHERS = 60;
      const characterIdleMinutes = readIntegerParameter(
        "idleMinutes",
        10,
        1,
        1440,
      );
      const characterIdleMs = characterIdleMinutes * 60_000;
      const dayNightCycleMs =
        readIntegerParameter("cycleMinutes", 10, 1, 1440) * 60_000;
      const despawnFadeMs = 800;
      function readIntegerParameter(name, fallback, minimum, maximum) {
        const raw = overlayParameters.get(name);
        const value = raw === null ? fallback : Number(raw);
        return Number.isInteger(value) && value >= minimum && value <= maximum
          ? value
          : fallback;
      }
      await app.init({
        resizeTo: window,
        autoDensity: true,
        resolution: window.devicePixelRatio || 1,
        backgroundAlpha: 0,
      });
      app.renderer.background.alpha = 0;
      document.body.appendChild(app.canvas);
      const debugOverlay = document.createElement("div");
      debugOverlay.setAttribute("aria-live", "polite");
      debugOverlay.style.cssText =
        "position:fixed;top:12px;left:12px;z-index:10;padding:10px 12px;border:1px solid #ffffff38;border-radius:8px;background:#101714e8;color:#edffe8;font:600 13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;pointer-events:none;display:none";
      document.body.appendChild(debugOverlay);
      let debugEnabled = false;
      let panicMode = false;
      let debugFrameCount = 0;
      let debugElapsedMs = 0;

      function toggleDebugOverlay(event) {
        if (
          panicMode ||
          event.repeat ||
          event.key.toLowerCase() !== "d" ||
          event.altKey ||
          event.ctrlKey ||
          event.metaKey
        ) {
          return;
        }
        debugEnabled = !debugEnabled;
        debugOverlay.style.display = debugEnabled ? "block" : "none";
        if (debugEnabled) updateDebugOverlay(0);
      }

      window.addEventListener("keydown", toggleDebugOverlay);

      function updateDebugOverlay(elapsedMs) {
        if (!debugEnabled) return;
        debugFrameCount += 1;
        debugElapsedMs += elapsedMs;
        if (debugElapsedMs < 500) return;
        const fps = Math.round((debugFrameCount * 1000) / debugElapsedMs);
        debugOverlay.textContent = `FPS      ${fps}\nCharacters ${characters.size}`;
        debugFrameCount = 0;
        debugElapsedMs = 0;
      }

      const townMap = [
        "gggggggggggggggggg",
        "gggTggggggggTggggg",
        "gggggggggggggggggg",
        "pppppppppppppppppp",
        "ggggggppgggggggggg",
        "gTggggppgHggTggggg",
        "ggggggppgggggggggg",
        "ggggggppppppppgggg",
        "gggHggggggggppgggg",
        "ggggggggggggppgggg",
      ];
      const tileColors = {
        g: ["#69a84f", "#72b256"],
        p: ["#c59a62", "#d2a96e"],
      };
      const townGraphics = new Graphics();
      const depthLayer = new Container();
      const sceneTint = new Graphics();
      const nightLighting = new Graphics();
      const fireflyGraphics = new Graphics();
      const effectLayer = new Container();
      depthLayer.sortableChildren = true;
      const decorations = [];
      const houses = [];
      const townAdditions = [];
      const townObjectIds = new Set();
      const characters = new Map();
      const viewerProfiles = new Map();
      const characterPool = [];
      const effectQueue = [];
      const levelupCelebrations = [];
      let activeEffect = null;
      const occupiedTiles = new Set();
      const reservedTiles = new Set();
      const walkDirections = ["up", "down", "left", "right"];
      const fireflies = Array.from({ length: 14 }, () => ({
        x: Math.random(),
        y: 0.44 + Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2,
      }));
      let cycleElapsedMs = 0;
      let nightLevel = 0;
      let sceneTransition = null;
      let nightDecorationsUpdateMs = 0;
      let lastHouseLightingLevel = 0;
      let fireflyElapsedMs = 0;
      app.stage.addChild(
        townGraphics,
        depthLayer,
        sceneTint,
        nightLighting,
        fireflyGraphics,
        effectLayer,
      );

      function drawTownMap() {
        townGraphics.clear();
        const tileWidth = app.screen.width / townMap[0].length;
        const tileHeight = app.screen.height / townMap.length;
        sceneTint.clear();
        sceneTint
          .rect(0, 0, app.screen.width, app.screen.height)
          .fill({ color: "#1a2850", alpha: 0.42 });
        sceneTint.alpha = nightLevel;

        townMap.forEach((row, rowIndex) => {
          [...row].forEach((tile, columnIndex) => {
            const x = columnIndex * tileWidth;
            const y = rowIndex * tileHeight;
            const colors = tileColors[tile === "p" ? "p" : "g"];
            const color = colors[(rowIndex + columnIndex) % colors.length];
            townGraphics.rect(x, y, tileWidth + 1, tileHeight + 1).fill(color);
          });
        });

        for (const decoration of decorations) {
          depthLayer.removeChild(decoration);
          decoration.destroy({ children: true });
        }
        decorations.length = 0;
        houses.length = 0;

        townMap.forEach((row, rowIndex) => {
          [...row].forEach((tile, columnIndex) => {
            if (tile === "T")
              addTree(rowIndex, columnIndex, tileWidth, tileHeight);
            if (tile === "H")
              addHouse(rowIndex, columnIndex, tileWidth, tileHeight);
          });
        });

        for (const addition of townAdditions) {
          addition.sprite =
            addition.kind === "house"
              ? addHouse(
                  addition.row,
                  addition.column,
                  tileWidth,
                  tileHeight,
                  addition.houseStyle ?? "tent",
                  addition.ownerUserId ?? null,
                )
              : addTree(addition.row, addition.column, tileWidth, tileHeight);
          if (activeEffect?.addition === addition) {
            const progress = Math.min(
              activeEffect.elapsed / activeEffect.duration,
              1,
            );
            addition.sprite.scale.set(0.55 + (1 - (1 - progress) ** 3) * 0.45);
            addition.sprite.alpha = Math.min(1, progress * 2);
          }
        }
        drawStreetLamps();

        for (const character of characters.values()) {
          if (character.state === "walking") {
            reservedTiles.delete(character.target.key);
            character.target = null;
            character.state = "pause";
            character.stateTimer = 1000;
            character.animationFrame = 0;
            renderCharacter(character);
          }

          const tileSize = Math.min(tileWidth, tileHeight);
          drawCharacterShadow(character.shadowGraphics, tileSize);
          character.tileSize = tileSize;
          renderCharacter(character);
          character.nameLabel.y = -(tileSize * 1.55);
          character.baseX = (character.column + 0.5) * tileWidth;
          character.baseY = (character.row + 1) * tileHeight;
          if (character.state !== "parading") {
            character.sprite.x = character.baseX;
            character.sprite.y = character.baseY;
            character.sprite.zIndex = character.sprite.y;
          }
          if (character.bubble) {
            character.bubble.baseScale = 1;
            positionSpeechBubble(character);
            updateBubbleAppearance(character.bubble);
          }
        }
      }

      function addTree(row, column, tileWidth, tileHeight) {
        const tree = new Container();
        const graphics = new Graphics();
        const baseX = (column + 0.5) * tileWidth;
        const baseY = (row + 1) * tileHeight;

        graphics
          .rect(
            -tileWidth * 0.3,
            -tileHeight * 0.84,
            tileWidth * 0.6,
            tileHeight * 0.55,
          )
          .fill("#27633b");
        graphics
          .rect(
            -tileWidth * 0.43,
            -tileHeight * 0.62,
            tileWidth * 0.86,
            tileHeight * 0.42,
          )
          .fill("#27633b");
        graphics
          .rect(
            -tileWidth * 0.27,
            -tileHeight * 0.76,
            tileWidth * 0.54,
            tileHeight * 0.25,
          )
          .fill("#347947");
        graphics
          .rect(
            -tileWidth * 0.1,
            -tileHeight * 0.28,
            tileWidth * 0.2,
            tileHeight * 0.28,
          )
          .fill("#795132");

        tree.addChild(graphics);
        tree.position.set(baseX, baseY);
        tree.zIndex = baseY + 0.1;
        depthLayer.addChild(tree);
        decorations.push(tree);
        return tree;
      }

      function addHouse(
        row,
        column,
        tileWidth,
        tileHeight,
        houseStyle = "house",
        ownerUserId = null,
      ) {
        const house = new Container();
        const graphics = new Graphics();
        const windowGraphics = new Graphics();
        const baseX = (column + 0.5) * tileWidth;
        const baseY = (row + 1) * tileHeight;
        drawHouseBody(graphics, houseStyle, tileWidth, tileHeight);
        house.addChild(graphics, windowGraphics);
        house.position.set(baseX, baseY);
        house.zIndex = baseY + 0.1;
        house.windowGraphics = windowGraphics;
        house.graphics = graphics;
        house.houseStyle = houseStyle;
        house.ownerUserId = ownerUserId;
        house.row = row;
        house.column = column;
        depthLayer.addChild(house);
        decorations.push(house);
        houses.push(house);
        drawHouseWindows(house, nightLevel, tileWidth, tileHeight);
        return house;
      }

      function drawHouseBody(graphics, houseStyle, tileWidth, tileHeight) {
        graphics.clear();
        if (houseStyle === "tent") {
          graphics
            .moveTo(-tileWidth * 0.75, 0)
            .lineTo(0, -tileHeight * 1.5)
            .lineTo(tileWidth * 0.75, 0)
            .closePath()
            .fill("#c98255");
          graphics
            .moveTo(-tileWidth * 0.25, 0)
            .lineTo(0, -tileHeight * 0.68)
            .lineTo(tileWidth * 0.25, 0)
            .closePath()
            .fill("#493d39");
          graphics
            .moveTo(-tileWidth * 0.75, 0)
            .lineTo(0, -tileHeight * 1.5)
            .lineTo(tileWidth * 0.75, 0)
            .closePath()
            .stroke({
              color: "#f1c48d",
              width: Math.max(1, tileWidth * 0.035),
            });
          return;
        }

        const isMansion = houseStyle === "mansion";
        const isCabin = houseStyle === "cabin";
        const bodyWidth = isMansion ? 1.72 : 1.44;
        const bodyHeight = isMansion ? 1.46 : isCabin ? 0.98 : 1.2;
        const roofHeight = isMansion ? 0.86 : isCabin ? 0.62 : 0.89;
        const wallColor = isMansion
          ? "#e9d8b4"
          : isCabin
            ? "#a86f49"
            : "#d6a36d";
        const roofColor = isMansion
          ? "#564963"
          : isCabin
            ? "#6d4937"
            : "#9b4e43";
        graphics
          .rect(
            (-tileWidth * bodyWidth) / 2,
            -tileHeight * bodyHeight,
            tileWidth * bodyWidth,
            tileHeight * bodyHeight,
          )
          .fill(wallColor);
        graphics
          .moveTo(-tileWidth * (bodyWidth / 2 + 0.18), -tileHeight * bodyHeight)
          .lineTo(0, -tileHeight * (bodyHeight + roofHeight))
          .lineTo(tileWidth * (bodyWidth / 2 + 0.18), -tileHeight * bodyHeight)
          .closePath()
          .fill(roofColor);
        graphics
          .rect(
            -tileWidth * 0.14,
            -tileHeight * (isMansion ? 0.5 : 0.46),
            tileWidth * 0.28,
            tileHeight * (isMansion ? 0.5 : 0.46),
          )
          .fill("#684433");
        if (isMansion) {
          graphics
            .rect(
              -tileWidth * 0.24,
              -tileHeight * 1.76,
              tileWidth * 0.48,
              tileHeight * 0.3,
            )
            .fill("#e9d8b4");
          graphics
            .moveTo(-tileWidth * 0.34, -tileHeight * 1.72)
            .lineTo(0, -tileHeight * 2.04)
            .lineTo(tileWidth * 0.34, -tileHeight * 1.72)
            .closePath()
            .fill(roofColor);
        }
      }

      function drawHouseWindows(house, level, tileWidth, tileHeight) {
        const graphics = house.windowGraphics;
        const day = [140, 197, 206];
        const night = [255, 215, 122];
        const color = `#${day
          .map((value, index) =>
            Math.round(value + (night[index] - value) * level)
              .toString(16)
              .padStart(2, "0"),
          )
          .join("")}`;
        graphics.clear();
        if (house.houseStyle === "tent") return;
        const windowY =
          house.houseStyle === "cabin"
            ? -tileHeight * 0.68
            : house.houseStyle === "mansion"
              ? -tileHeight * 1.12
              : -tileHeight * 0.86;
        const windowSize = house.houseStyle === "mansion" ? 0.2 : 0.24;
        graphics
          .rect(
            -tileWidth * 0.55,
            windowY,
            tileWidth * windowSize,
            tileHeight * windowSize,
          )
          .fill({ color, alpha: 0.92 });
        graphics
          .rect(
            tileWidth * 0.31,
            windowY,
            tileWidth * windowSize,
            tileHeight * windowSize,
          )
          .fill({ color, alpha: 0.92 });
        if (house.houseStyle === "mansion") {
          graphics
            .rect(
              -tileWidth * 0.55,
              -tileHeight * 0.68,
              tileWidth * 0.2,
              tileHeight * 0.2,
            )
            .fill({ color, alpha: 0.92 });
          graphics
            .rect(
              tileWidth * 0.35,
              -tileHeight * 0.68,
              tileWidth * 0.2,
              tileHeight * 0.2,
            )
            .fill({ color, alpha: 0.92 });
        }
      }

      function setScene(scene) {
        cycleElapsedMs = scene === "night" ? dayNightCycleMs / 2 : 0;
        sceneTransition = {
          from: nightLevel,
          to: scene === "night" ? 1 : 0,
          elapsed: 0,
          duration: 1_200,
        };
      }

      function updateDayNight(elapsedMs) {
        cycleElapsedMs = (cycleElapsedMs + elapsedMs) % dayNightCycleMs;
        fireflyElapsedMs += elapsedMs;
        const cycleProgress = cycleElapsedMs / dayNightCycleMs;
        const naturalLevel = (1 - Math.cos(cycleProgress * Math.PI * 2)) / 2;
        if (sceneTransition) {
          sceneTransition.elapsed += elapsedMs;
          const progress = Math.min(
            sceneTransition.elapsed / sceneTransition.duration,
            1,
          );
          const eased = progress * progress * (3 - 2 * progress);
          nightLevel =
            sceneTransition.from +
            (sceneTransition.to - sceneTransition.from) * eased;
          if (progress >= 1) sceneTransition = null;
        } else {
          nightLevel = naturalLevel;
        }

        sceneTint.alpha = nightLevel;
        if (Math.abs(nightLevel - lastHouseLightingLevel) >= 0.025) {
          lastHouseLightingLevel = nightLevel;
          for (const house of houses) {
            drawHouseWindows(
              house,
              nightLevel,
              app.screen.width / townMap[0].length,
              app.screen.height / townMap.length,
            );
          }
        }

        nightDecorationsUpdateMs += elapsedMs;
        if (nightDecorationsUpdateMs >= 100) {
          nightDecorationsUpdateMs %= 100;
          drawStreetLamps();
        }
        drawFireflies();
      }

      function drawStreetLamps() {
        nightLighting.clear();
        if (nightLevel < 0.01) return;
        const tileWidth = app.screen.width / townMap[0].length;
        const tileHeight = app.screen.height / townMap.length;
        const baseY = 4 * tileHeight;
        for (const column of [2, 7, 12, 16]) {
          const x = (column + 0.5) * tileWidth;
          nightLighting
            .circle(x, baseY - tileHeight * 0.34, tileWidth * 0.58)
            .fill({ color: "#ffd77a", alpha: nightLevel * 0.09 });
          nightLighting
            .rect(x - 1.5, baseY - tileHeight * 0.75, 3, tileHeight * 0.75)
            .fill({ color: "#433c35", alpha: nightLevel * 0.85 });
          nightLighting
            .circle(x, baseY - tileHeight * 0.78, tileWidth * 0.09)
            .fill({ color: "#ffe6a6", alpha: nightLevel * 0.9 });
        }
      }

      function drawFireflies() {
        fireflyGraphics.clear();
        const visibility = Math.max(0, Math.min(1, (nightLevel - 0.16) / 0.55));
        if (visibility < 0.01) return;
        const time = fireflyElapsedMs / 1000;
        for (const firefly of fireflies) {
          const phase = time * 0.65 + firefly.phase;
          const x =
            firefly.x * app.screen.width +
            Math.sin(phase * 0.7) *
              (app.screen.width / townMap[0].length) *
              0.4;
          const y =
            firefly.y * app.screen.height +
            Math.sin(phase) * (app.screen.height / townMap.length) * 0.2;
          const glow = visibility * (0.14 + (Math.sin(phase) + 1) * 0.08);
          fireflyGraphics
            .circle(x, y, 5)
            .fill({ color: "#c9f49a", alpha: glow * 0.18 });
          fireflyGraphics
            .circle(x, y, 1.7)
            .fill({ color: "#e6ffbd", alpha: glow });
        }
      }

      async function loadTownState() {
        try {
          const response = await fetch("/api/town");
          if (!response.ok)
            throw new Error(`Town load failed: ${response.status}`);
          const snapshot = await response.json();
          for (const viewer of snapshot.viewers ?? []) {
            if (viewer.userId && viewer.profile)
              applyViewerProfile(viewer.userId, viewer.profile);
          }
          for (const object of snapshot.townObjects ?? []) {
            if (townObjectIds.has(object.id)) continue;
            townObjectIds.add(object.id);
            townAdditions.push({
              kind: object.type,
              row: object.row,
              column: object.column,
              ownerUserId: object.ownerTwitchId,
              houseStyle:
                object.type === "house" ? (object.style ?? "tent") : null,
              objectId: object.id,
              sprite: null,
            });
          }
        } catch (error) {
          console.error("[Chat Town overlay] unable to load town", error);
        }
        drawTownMap();
      }
      void loadTownState();
      window.addEventListener("resize", drawTownMap);

      const skinColors = ["#f2c49b", "#d99a6c", "#b97850", "#80513f"];
      const hairColors = [
        "#30252b",
        "#59382e",
        "#d49a42",
        "#b94e3f",
        "#e5d9bb",
      ];
      const hairStyles = ["short", "long", "bob", "spiky"];
      const outfits = [
        { shirt: "#d95d52", pants: "#384b7a" },
        { shirt: "#4d88b8", pants: "#574477" },
        { shirt: "#e0b84c", pants: "#487358" },
        { shirt: "#9a68a8", pants: "#54404b" },
        { shirt: "#e58c52", pants: "#426a72" },
      ];

      function spawnCharacter(username, userId = username) {
        const normalizedUsername = username.trim().toLowerCase();
        const identity = userId.trim() || normalizedUsername;
        if (!normalizedUsername || characters.has(identity)) return null;
        if (characters.size >= characterCap) return null;

        const spawnTile = chooseSpawnTile();
        if (!spawnTile) return null;

        const appearance = createAppearance(
          username,
          identity,
          normalizedUsername,
        );
        const character = createCharacter(appearance);
        character.identity = identity;
        character.lastChatAt = Date.now();
        const tileSize = Math.min(
          app.screen.width / townMap[0].length,
          app.screen.height / townMap.length,
        );
        character.row = spawnTile.row;
        character.column = spawnTile.column;
        character.tileSize = tileSize;
        character.baseX =
          (spawnTile.column + 0.5) * (app.screen.width / townMap[0].length);
        character.baseY =
          (spawnTile.row + 1) * (app.screen.height / townMap.length);
        character.sprite.x = character.baseX;
        character.sprite.y = character.baseY;
        character.sprite.zIndex = character.sprite.y;
        depthLayer.addChild(character.sprite);
        characters.set(identity, character);
        return character;
      }

      function createAppearance(
        username,
        identity,
        seedKey = username.toLowerCase(),
      ) {
        const random = createSeededRandom(hashUsername(seedKey));
        const profile = viewerProfiles.get(identity);
        const appearance = {
          username,
          skinColor: choose(skinColors, random),
          hairColor: choose(hairColors, random),
          hairStyle: choose(hairStyles, random),
          outfit: choose(outfits, random),
          level: profile?.level ?? 1,
          xp: profile?.xp ?? 0,
          hat: profile?.hat ?? null,
          houseStyle: profile?.houseStyle ?? "tent",
          nameplateColor: profile?.nameplateColor ?? "#ffffff",
        };
        return appearance;
      }

      function applyViewerProfile(userId, profile) {
        const current = {
          xp: Number(profile.xp) || 0,
          level: Number(profile.level) || 1,
          hat: typeof profile.hat === "string" ? profile.hat : null,
          houseStyle: ["tent", "cabin", "house", "mansion"].includes(
            profile.houseStyle,
          )
            ? profile.houseStyle
            : "tent",
          nameplateColor:
            typeof profile.nameplateColor === "string"
              ? profile.nameplateColor
              : "#ffffff",
        };
        viewerProfiles.set(userId, current);
        const character = characters.get(userId);
        if (character) {
          Object.assign(character.appearance, current);
          character.nameLabel.style.fill = current.nameplateColor;
          renderCharacter(character);
        }
        upgradeViewerHouses(userId, current.houseStyle);
      }

      function upgradeViewerHouses(userId, houseStyle) {
        const tileWidth = app.screen.width / townMap[0].length;
        const tileHeight = app.screen.height / townMap.length;
        for (const addition of townAdditions) {
          if (
            addition.kind !== "house" ||
            addition.ownerUserId !== userId ||
            addition.sprite.houseStyle === houseStyle
          ) {
            continue;
          }
          const previous = addition.sprite;
          const previousScale = previous.scale.x;
          const previousAlpha = previous.alpha;
          depthLayer.removeChild(previous);
          const decorationIndex = decorations.indexOf(previous);
          const houseIndex = houses.indexOf(previous);
          if (decorationIndex >= 0) decorations.splice(decorationIndex, 1);
          if (houseIndex >= 0) houses.splice(houseIndex, 1);
          previous.destroy({ children: true });
          addition.sprite = addHouse(
            addition.row,
            addition.column,
            tileWidth,
            tileHeight,
            houseStyle,
            userId,
          );
          addition.houseStyle = houseStyle;
          addition.sprite.scale.set(previousScale);
          addition.sprite.alpha = previousAlpha;
        }
      }

      function chooseSpawnTile(allowOccupiedFallback = true) {
        const grassTiles = [];
        const availableTiles = [];
        townMap.forEach((row, rowIndex) => {
          [...row].forEach((tile, columnIndex) => {
            const key = `${rowIndex}:${columnIndex}`;
            if (
              tile === "g" &&
              rowIndex > 2 &&
              !isHouseFootprint(rowIndex, columnIndex)
            ) {
              const spot = { row: rowIndex, column: columnIndex, key };
              grassTiles.push(spot);
              if (!occupiedTiles.has(key) && !reservedTiles.has(key)) {
                availableTiles.push(spot);
              }
            }
          });
        });

        const spawnOptions = availableTiles.length
          ? availableTiles
          : allowOccupiedFallback
            ? grassTiles
            : [];
        if (spawnOptions.length === 0) return null;
        const tile = choose(spawnOptions, Math.random);
        occupiedTiles.add(tile.key);
        return tile;
      }

      function isHouseFootprint(row, column) {
        return (
          townAdditions.some((addition) => {
            const radius = addition.kind === "house" ? 1 : 0;
            return (
              addition.row === row &&
              Math.abs(addition.column - column) <= radius
            );
          }) ||
          townMap[row]?.[column] === "H" ||
          townMap.some((mapRow, houseRow) => {
            if (houseRow !== row) return false;
            return [...mapRow].some(
              (tile, houseColumn) =>
                tile === "H" && Math.abs(houseColumn - column) <= 1,
            );
          })
        );
      }

      function createCharacter(appearance) {
        const character = characterPool.pop() || createCharacterSprite();
        const { graphics, shadowGraphics, sprite, nameLabel } = character;
        const tileSize = Math.min(
          app.screen.width / townMap[0].length,
          app.screen.height / townMap.length,
        );
        drawCharacterShadow(shadowGraphics, tileSize);
        nameLabel.text = appearance.username;
        nameLabel.style.fill = appearance.nameplateColor ?? "#ffffff";
        nameLabel.y = -(tileSize * 1.55);
        nameLabel.visible = true;
        graphics.scale.set(1);
        graphics.rotation = 0;
        graphics.y = 0;
        Object.assign(character, {
          appearance,
          tileSize,
          row: 0,
          column: 0,
          baseX: 0,
          baseY: 0,
          state: "idle",
          stateTimer: randomBetween(500, 1800),
          direction: choose(walkDirections, Math.random),
          animationFrame: 0,
          animationTimer: 0,
          bobTime: Math.random() * Math.PI * 2,
          target: null,
          bubble: null,
          fadeElapsed: 0,
          action: null,
          actionElapsed: 0,
        });
        sprite.alpha = 1;
        sprite.visible = true;
        renderCharacter(character);
        return character;
      }

      function createCharacterSprite() {
        const graphics = new Graphics();
        const shadowGraphics = new Graphics();
        const sprite = new Container();
        const nameLabel = new Text({
          text: "",
          style: {
            fontFamily: "Arial, sans-serif",
            fontSize: labelFontSize,
            fontWeight: "bold",
            fill: "#ffffff",
            stroke: {
              fill: "#1b2b20",
              width: Math.max(3, labelFontSize * 0.2),
            },
            dropShadow: {
              color: "#000000",
              alpha: 0.9,
              blur: 2,
              distance: 2,
              angle: Math.PI / 2,
            },
          },
          anchor: { x: 0.5, y: 1 },
        });
        sprite.addChild(shadowGraphics, graphics, nameLabel);
        return { sprite, graphics, shadowGraphics, nameLabel };
      }

      function drawCharacterShadow(shadowGraphics, tileSize) {
        shadowGraphics.clear();
        shadowGraphics
          .ellipse(0, -tileSize * 0.04, tileSize * 0.38, tileSize * 0.1)
          .fill({ color: "#17251a", alpha: 0.08 });
        shadowGraphics
          .ellipse(0, -tileSize * 0.03, tileSize * 0.27, tileSize * 0.07)
          .fill({ color: "#17251a", alpha: 0.1 });
        shadowGraphics
          .ellipse(0, -tileSize * 0.02, tileSize * 0.16, tileSize * 0.045)
          .fill({ color: "#17251a", alpha: 0.12 });
      }

      function renderCharacter(character) {
        const { graphics, appearance, direction } = character;
        const { skinColor, hairColor, hairStyle, outfit, hat, nameplateColor } =
          appearance;
        const pixel = character.tileSize / 8;
        const walking = character.state === "walking";
        const frame = walking ? character.animationFrame : 0;
        const sideFacing = direction === "left" || direction === "right";
        const stride = walking && frame === 0 ? 1 : walking ? -1 : 0;
        const pixelRect = (x, y, width, height, color) => {
          graphics
            .rect(
              (x - 4) * pixel,
              (y - 12) * pixel,
              width * pixel,
              height * pixel,
            )
            .fill(color);
        };

        graphics.clear();
        if (hairStyle === "long" || hairStyle === "bob") {
          pixelRect(1, 1, 6, 6, hairColor);
        }
        pixelRect(2, 1, 4, 4, skinColor);

        if (hairStyle === "spiky") {
          pixelRect(1, 1, 2, 1, hairColor);
          pixelRect(2, 0, 2, 2, hairColor);
          pixelRect(4, 1, 2, 1, hairColor);
          pixelRect(6, 1, 1, 2, hairColor);
        } else {
          pixelRect(1, 0, 6, 2, hairColor);
          if (hairStyle === "short") {
            pixelRect(1, 1, 1, 2, hairColor);
            pixelRect(6, 1, 1, 2, hairColor);
          } else {
            pixelRect(1, 1, 1, hairStyle === "long" ? 5 : 3, hairColor);
            pixelRect(6, 1, 1, hairStyle === "long" ? 5 : 3, hairColor);
          }
        }

        if (hat === "beanie") {
          pixelRect(1, -1, 6, 2, "#526f9e");
          pixelRect(1, 1, 6, 1, "#d4e0ee");
        } else if (hat === "flower") {
          pixelRect(2, -2, 2, 2, "#f1a9bc");
          pixelRect(4, -2, 2, 2, "#f1a9bc");
          pixelRect(3, -3, 2, 2, "#f1a9bc");
          pixelRect(3, -1, 2, 2, "#ffd166");
        } else if (hat === "crown") {
          pixelRect(1, -2, 6, 1, "#e5b93f");
          pixelRect(1, -3, 1, 2, "#ffdf70");
          pixelRect(3, -4, 2, 3, "#ffdf70");
          pixelRect(6, -3, 1, 2, "#ffdf70");
          pixelRect(2, -1, 4, 1, "#b07e28");
        }

        if (direction === "down") {
          pixelRect(3, 3, 1, 1, "#302a32");
          pixelRect(5, 3, 1, 1, "#302a32");
        } else if (direction === "left") {
          pixelRect(2, 3, 1, 1, "#302a32");
        } else if (direction === "right") {
          pixelRect(5, 3, 1, 1, "#302a32");
        }

        character.nameLabel.style.fill = nameplateColor ?? "#ffffff";

        if (sideFacing) {
          pixelRect(2, 5, 4, 4, outfit.shirt);
          pixelRect(direction === "left" ? 1 : 6, 5 + stride, 1, 3, skinColor);
          pixelRect(3 + stride, 9, 2, 2, outfit.pants);
          pixelRect(2 + stride, 11, 2, 1, "#40333a");
        } else {
          pixelRect(1, 5, 6, 4, outfit.shirt);
          pixelRect(0, 5 + stride, 1, 3, skinColor);
          pixelRect(7, 5 - stride, 1, 3, skinColor);
          pixelRect(2 + stride, 9, 1, 2, outfit.pants);
          pixelRect(5 - stride, 9, 1, 2, outfit.pants);
          pixelRect(1 + stride, 11, 2, 1, "#40333a");
          pixelRect(5 - stride, 11, 2, 1, "#40333a");
        }

        if (character.action === "wave") {
          pixelRect(direction === "left" ? 1 : 6, 0, 1, 5, skinColor);
        }
      }

      function showSpeechBubble(character, message) {
        if (character.bubble) {
          character.sprite.removeChild(character.bubble.container);
          character.bubble.container.destroy({ children: true });
        }

        const maxWidth = Math.max(80, Math.min(300, window.innerWidth - 16));
        const paddingX = 10;
        const paddingY = 7;
        const fontSize = Math.max(12, Math.min(16, labelFontSize * 0.75));
        const textWidth = Math.max(48, maxWidth - paddingX * 2);
        const charactersPerLine = Math.floor(textWidth / (fontSize * 0.55));
        const maxCharacters = Math.max(
          30,
          Math.min(180, charactersPerLine * 4),
        );
        const bubbleText = new Text({
          text: truncateMessage(message, maxCharacters),
          style: {
            fontFamily: "Arial, sans-serif",
            fontSize,
            fontWeight: "bold",
            fill: "#ffffff",
            stroke: { fill: "#142018", width: 2 },
            dropShadow: {
              color: "#000000",
              alpha: 0.8,
              blur: 2,
              distance: 1,
              angle: Math.PI / 2,
            },
            wordWrap: true,
            wordWrapWidth: textWidth,
            breakWords: true,
            lineHeight: fontSize * 1.2,
          },
        });
        bubbleText.anchor.set(0.5, 0);

        const width = Math.min(
          maxWidth,
          Math.max(72, bubbleText.width + paddingX * 2),
        );
        const height = bubbleText.height + paddingY * 2;
        const bubbleGraphics = new Graphics();
        const bubbleColor = { color: "#142018", alpha: 0.94 };
        bubbleGraphics
          .roundRect(-width / 2, -height, width, height, 8)
          .fill(bubbleColor);
        bubbleGraphics
          .moveTo(-7, 0)
          .lineTo(0, 7)
          .lineTo(7, 0)
          .closePath()
          .fill(bubbleColor);
        bubbleText.y = -height + paddingY;

        const container = new Container();
        container.addChild(bubbleGraphics, bubbleText);
        container.alpha = 0;
        character.sprite.addChild(container);
        character.bubble = {
          container,
          width,
          age: 0,
          baseScale: 1 / character.sprite.scale.x,
        };
        updateBubbleAppearance(character.bubble);
        positionSpeechBubble(character);
      }

      function truncateMessage(message, maxCharacters) {
        const characters = Array.from(message.trim());
        if (characters.length <= maxCharacters) return characters.join("");
        return `${characters
          .slice(0, maxCharacters - 1)
          .join("")
          .trimEnd()}…`;
      }

      function updateBubbleAppearance(bubble) {
        const popProgress = Math.min(bubble.age / 160, 1);
        const popEase = 1 - (1 - popProgress) ** 3;
        const fadeProgress = Math.max(0, (bubble.age - 3_800) / 200);
        bubble.container.alpha = popEase * (1 - fadeProgress);
        const popScale = 0.72 + 0.28 * popEase;
        bubble.container.scale.set(bubble.baseScale * popScale);
      }

      function positionSpeechBubble(character) {
        const bubble = character.bubble;
        if (!bubble) return;

        const scale = character.sprite.scale.x;
        const minimumX = bubble.width / 2 + 4;
        const maximumX = app.screen.width - bubble.width / 2 - 4;
        const centerX = Math.max(
          minimumX,
          Math.min(maximumX, character.sprite.x),
        );
        bubble.container.x = (centerX - character.sprite.x) / scale;
        bubble.container.y =
          character.nameLabel.y - (labelFontSize + 14) / scale;
      }

      function advanceSpeechBubble(character, deltaMs) {
        const bubble = character.bubble;
        if (!bubble) return;

        bubble.age += deltaMs;
        if (bubble.age >= 4_000) {
          character.sprite.removeChild(bubble.container);
          bubble.container.destroy({ children: true });
          character.bubble = null;
          return;
        }

        updateBubbleAppearance(bubble);
      }

      function findWanderTarget(character) {
        const steps = {
          up: { row: -1, column: 0 },
          down: { row: 1, column: 0 },
          left: { row: 0, column: -1 },
          right: { row: 0, column: 1 },
        };
        const targets = [];

        for (const direction of walkDirections) {
          const step = steps[direction];
          for (let distance = 1; distance <= 3; distance += 1) {
            const row = character.row + step.row * distance;
            const column = character.column + step.column * distance;
            if (row < 3 || row >= townMap.length) break;

            const tile = townMap[row][column];
            if (
              !tile ||
              tile === "T" ||
              tile === "H" ||
              isHouseFootprint(row, column)
            ) {
              break;
            }

            const key = `${row}:${column}`;
            if (occupiedTiles.has(key) || reservedTiles.has(key)) break;
            targets.push({ row, column, key, direction });
          }
        }

        return targets.length ? choose(targets, Math.random) : null;
      }

      function startWandering(character) {
        const target = findWanderTarget(character);
        if (!target) {
          character.state = "idle";
          character.stateTimer = randomBetween(700, 1800);
          return;
        }

        character.state = "walking";
        character.target = target;
        character.direction = target.direction;
        character.animationFrame = 0;
        character.animationTimer = 0;
        character.sprite.y = character.baseY;
        reservedTiles.add(target.key);
        renderCharacter(character);
      }

      function updateCharacters(elapsedMs) {
        const deltaMs = Math.min(elapsedMs, 50);

        for (const character of characters.values()) {
          if (
            character.state !== "despawning" &&
            Date.now() - character.lastChatAt >= characterIdleMs
          ) {
            beginDespawn(character);
          }
          if (character.state === "despawning") {
            character.fadeElapsed += deltaMs;
            character.sprite.alpha = Math.max(
              0,
              1 - character.fadeElapsed / despawnFadeMs,
            );
            if (character.fadeElapsed >= despawnFadeMs)
              recycleCharacter(character);
            continue;
          }
          if (character.state === "parading") continue;
          if (character.state === "dispersing") {
            character.disperseElapsed += deltaMs;
            character.sprite.alpha = Math.min(
              1,
              character.disperseElapsed / RAID_PARADE_TIMELINE.disperseMs,
            );
            if (character.disperseElapsed >= RAID_PARADE_TIMELINE.disperseMs) {
              character.state = "idle";
              character.stateTimer = randomBetween(500, 1800);
              character.nameLabel.visible = true;
            }
            continue;
          }
          advanceSpeechBubble(character, deltaMs);
          updateCharacterAction(character, deltaMs);
          if (character.state !== "walking") {
            character.bobTime += deltaMs;
            character.sprite.y =
              character.baseY + Math.sin(character.bobTime / 240) * 2;
            character.sprite.zIndex = character.sprite.y;
            character.stateTimer -= deltaMs;
            if (character.stateTimer <= 0) startWandering(character);
            positionSpeechBubble(character);
            continue;
          }

          character.animationTimer += deltaMs;
          if (character.animationTimer >= 150) {
            character.animationTimer %= 150;
            character.animationFrame = 1 - character.animationFrame;
            renderCharacter(character);
          }

          const tileWidth = app.screen.width / townMap[0].length;
          const tileHeight = app.screen.height / townMap.length;
          const targetX = (character.target.column + 0.5) * tileWidth;
          const targetY = (character.target.row + 1) * tileHeight;
          const distanceX = targetX - character.sprite.x;
          const distanceY = targetY - character.sprite.y;
          const distance = Math.hypot(distanceX, distanceY);
          const travel = (character.tileSize * 1.5 * deltaMs) / 1000;

          if (distance <= travel) {
            occupiedTiles.delete(`${character.row}:${character.column}`);
            reservedTiles.delete(character.target.key);
            occupiedTiles.add(character.target.key);
            character.row = character.target.row;
            character.column = character.target.column;
            character.target = null;
            character.baseX = targetX;
            character.baseY = targetY;
            character.sprite.x = targetX;
            character.sprite.y = targetY;
            character.state = "pause";
            character.stateTimer = randomBetween(900, 2600);
            character.animationFrame = 0;
            renderCharacter(character);
          } else if (distance > 0) {
            character.sprite.x += (distanceX / distance) * travel;
            character.sprite.y += (distanceY / distance) * travel;
          }

          character.sprite.zIndex = character.sprite.y;
          positionSpeechBubble(character);
        }
      }

      function updateCharacterAction(character, deltaMs) {
        if (!character.action) return;
        character.actionElapsed += deltaMs;
        const progress = Math.min(character.actionElapsed / 2_000, 1);
        const { graphics, action } = character;
        if (action === "jump") {
          const lift = Math.sin(progress * Math.PI) * character.tileSize * 0.48;
          graphics.y = -lift;
          character.nameLabel.y = -(character.tileSize * 1.55) - lift;
        } else if (action === "sit") {
          graphics.scale.y = 0.72;
          graphics.y = character.tileSize * 0.18;
        } else {
          graphics.rotation = Math.sin(character.actionElapsed / 150) * 0.1;
        }
        if (action === "wave") {
          graphics.rotation = Math.sin(character.actionElapsed / 220) * 0.07;
        }
        if (character.actionElapsed >= 2_000) {
          character.action = null;
          character.actionElapsed = 0;
          graphics.y = 0;
          graphics.rotation = 0;
          graphics.scale.set(1);
          character.nameLabel.y = -(character.tileSize * 1.55);
          renderCharacter(character);
        }
        positionSpeechBubble(character);
      }

      function beginDespawn(character) {
        if (character.state === "despawning") return;
        if (character.target) reservedTiles.delete(character.target.key);
        character.target = null;
        character.state = "despawning";
        character.fadeElapsed = 0;
      }

      function recycleCharacter(character) {
        characters.delete(character.identity);
        occupiedTiles.delete(`${character.row}:${character.column}`);
        if (character.bubble) {
          character.sprite.removeChild(character.bubble.container);
          character.bubble.container.destroy({ children: true });
          character.bubble = null;
        }
        depthLayer.removeChild(character.sprite);
        character.sprite.alpha = 1;
        character.sprite.visible = false;
        characterPool.push(character);
      }

      function queueEffect(event) {
        effectQueue.push(event);
      }

      function showLevelupCelebration(event) {
        const container = new Container();
        const sparkles = new Graphics();
        const label = makeEffectLabel(
          `${event.displayName} reached level ${event.level}!`,
          16,
        );
        label.y = 9;
        container.addChild(sparkles, label);
        container.position.set(app.screen.width / 2, app.screen.height * 0.22);
        effectLayer.addChild(container);
        levelupCelebrations.push({
          container,
          sparkles,
          elapsed: 0,
          baseY: container.y,
        });
      }

      function updateLevelupCelebrations(elapsedMs) {
        for (
          let index = levelupCelebrations.length - 1;
          index >= 0;
          index -= 1
        ) {
          const celebration = levelupCelebrations[index];
          celebration.elapsed += Math.min(elapsedMs, 50);
          const progress = Math.min(celebration.elapsed / 1_500, 1);
          celebration.container.alpha =
            Math.min(1, progress * 5) * Math.min(1, (1 - progress) * 4);
          celebration.container.y = celebration.baseY - progress * 18;
          celebration.container.scale.set(0.85 + Math.min(progress * 2, 0.15));
          celebration.sparkles.clear();
          for (let sparkle = 0; sparkle < 7; sparkle += 1) {
            const angle = (sparkle / 7) * Math.PI * 2;
            const radius =
              24 + Math.sin(celebration.elapsed / 100 + sparkle) * 5;
            celebration.sparkles
              .circle(Math.cos(angle) * radius, Math.sin(angle) * 6, 2.5)
              .fill({ color: sparkle % 2 ? "#ffd166" : "#a4d17b", alpha: 0.8 });
          }
          if (progress >= 1) {
            effectLayer.removeChild(celebration.container);
            celebration.container.destroy({ children: true });
            levelupCelebrations.splice(index, 1);
          }
        }
      }

      function updateEffects(elapsedMs) {
        if (!activeEffect) startNextEffect();
        if (!activeEffect) return;
        activeEffect.elapsed += Math.min(elapsedMs, 50);
        const progress = Math.min(
          activeEffect.elapsed / activeEffect.duration,
          1,
        );

        if (activeEffect.type === "follow") {
          const eased = 1 - (1 - progress) ** 3;
          activeEffect.addition.sprite.scale.set(0.55 + eased * 0.45);
          activeEffect.addition.sprite.alpha = Math.min(1, progress * 2);
          activeEffect.label.alpha = Math.min(1, progress * 3);
          activeEffect.label.y = activeEffect.labelStartY - progress * 34;
        } else if (activeEffect.type === "sub") {
          drawFireworks(activeEffect, progress);
          activeEffect.label.alpha =
            Math.min(1, progress * 5) * Math.min(1, (1 - progress) * 5);
        } else if (activeEffect.type === "raid") {
          updateRaidParade(activeEffect);
        } else {
          drawBitsRain(activeEffect, progress);
          activeEffect.label.alpha =
            Math.min(1, progress * 5) * Math.min(1, (1 - progress) * 5);
        }

        if (progress >= 1) finishActiveEffect();
      }

      function startNextEffect() {
        while (!activeEffect && effectQueue.length) {
          const event = effectQueue.shift();
          if (event.type === "follow") startFollowEffect(event);
          else if (event.type === "sub") startSubscriptionEffect(event);
          else if (event.type === "bits") startBitsEffect(event);
          else if (event.type === "raid") startRaidParade(event);
        }
      }

      function startRaidParade(event) {
        const count = Math.min(
          Math.max(0, Math.floor(Number(event.viewerCount) || 0)),
          MAX_RAID_MARCHERS,
          Math.max(0, characterCap - characters.size),
        );
        const tileWidth = app.screen.width / townMap[0].length;
        const tileHeight = app.screen.height / townMap.length;
        const marchMs =
          ((app.screen.width + tileWidth * 2) /
            (tileWidth * RAID_PARADE_TIMELINE.marchSpeedTilesPerSecond)) *
          1000;
        const label = new Text({
          text: `${event.displayName} is raiding with ${event.viewerCount} viewers!`,
          style: {
            fontFamily: "Arial, sans-serif",
            fontSize: Math.max(18, Math.min(32, app.screen.width / 48)),
            fontWeight: "bold",
            fill: "#fff8db",
            stroke: { fill: "#18241b", width: 4 },
            dropShadow: { color: "#000000", alpha: 0.65, blur: 4, distance: 3 },
          },
          anchor: { x: 0.5, y: 0.5 },
        });
        const banner = new Container();
        const background = new Graphics();
        const paddingX = 24;
        const paddingY = 14;
        background
          .roundRect(
            0,
            0,
            label.width + paddingX * 2,
            label.height + paddingY * 2,
            14,
          )
          .fill({ color: "#31553b", alpha: 0.92 })
          .stroke({ color: "#f4d36b", width: 3, alpha: 0.95 });
        label.position.set(background.width / 2, background.height / 2);
        banner.addChild(background, label);
        banner.position.set(-background.width, app.screen.height * 0.16);
        effectLayer.addChild(banner);

        const raiders = [];
        const raidId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        for (let index = 0; index < count; index += 1) {
          const identity = `raid-${raidId}-${index}`;
          const character = createCharacter(
            createAppearance(
              event.displayName,
              identity,
              `${event.displayName.toLowerCase()}-${raidId}-${index}`,
            ),
          );
          character.identity = identity;
          character.lastChatAt = Date.now();
          character.row = 3;
          character.column = 0;
          character.tileSize = Math.min(tileWidth, tileHeight);
          character.baseY = tileHeight * 4;
          character.baseX = -tileWidth;
          character.sprite.position.set(character.baseX, character.baseY);
          character.sprite.zIndex = character.baseY;
          character.direction = "right";
          character.state = "parading";
          character.nameLabel.visible = false;
          depthLayer.addChild(character.sprite);
          characters.set(identity, character);
          raiders.push(character);
        }

        activeEffect = {
          type: "raid",
          elapsed: 0,
          duration:
            RAID_PARADE_TIMELINE.bannerEnterMs +
            RAID_PARADE_TIMELINE.marcherDelayMs +
            Math.max(0, count - 1) * RAID_PARADE_TIMELINE.marcherStaggerMs +
            marchMs +
            RAID_PARADE_TIMELINE.disperseMs,
          banner,
          bannerWidth: background.width,
          bannerHeight: background.height,
          marchMs,
          raiders,
          tileWidth,
          tileHeight,
        };
      }

      function updateRaidParade(parade) {
        const enterProgress = Math.min(
          parade.elapsed / RAID_PARADE_TIMELINE.bannerEnterMs,
          1,
        );
        const easedEnter = 1 - (1 - enterProgress) ** 3;
        const centerX = app.screen.width / 2;
        parade.banner.x =
          -parade.bannerWidth +
          (centerX - parade.bannerWidth / 2 + parade.bannerWidth) * easedEnter;
        const marcherStart =
          RAID_PARADE_TIMELINE.bannerEnterMs +
          RAID_PARADE_TIMELINE.marcherDelayMs;
        const marchComplete =
          marcherStart +
          Math.max(0, parade.raiders.length - 1) *
            RAID_PARADE_TIMELINE.marcherStaggerMs +
          parade.marchMs;
        if (parade.elapsed >= marchComplete) {
          if (!parade.dispersed) {
            disperseRaiders(parade);
            parade.dispersed = true;
          }
          parade.banner.alpha = Math.max(
            0,
            1 -
              (parade.elapsed - marchComplete) /
                RAID_PARADE_TIMELINE.disperseMs,
          );
        }
        for (let index = 0; index < parade.raiders.length; index += 1) {
          const character = parade.raiders[index];
          if (character.state !== "parading") continue;
          const localElapsed =
            parade.elapsed -
            marcherStart -
            index * RAID_PARADE_TIMELINE.marcherStaggerMs;
          if (localElapsed < 0) continue;
          const progress = Math.min(localElapsed / parade.marchMs, 1);
          character.sprite.x =
            -parade.tileWidth +
            (app.screen.width + parade.tileWidth * 2) * progress;
          character.sprite.y = character.baseY;
          character.sprite.zIndex = character.sprite.y;
          const frame = Math.floor(localElapsed / 150) % 2;
          if (character.animationFrame !== frame) {
            character.animationFrame = frame;
            renderCharacter(character);
          }
        }
      }

      function disperseRaiders(parade) {
        for (const character of parade.raiders) {
          const tile = chooseSpawnTile(false) ?? chooseSpawnTile();
          if (!tile) {
            recycleCharacter(character);
            continue;
          }
          character.row = tile.row;
          character.column = tile.column;
          character.baseX = (tile.column + 0.5) * parade.tileWidth;
          character.baseY = (tile.row + 1) * parade.tileHeight;
          character.sprite.position.set(character.baseX, character.baseY);
          character.sprite.zIndex = character.baseY;
          character.sprite.alpha = 0;
          character.disperseElapsed = 0;
          character.state = "dispersing";
        }
      }

      function startFollowEffect(event) {
        const object = event.townObject;
        if (!object || townObjectIds.has(object.id)) return;
        townObjectIds.add(object.id);
        const kind = object.type;
        const spot = { row: object.row, column: object.column };
        const addition = {
          kind,
          row: spot.row,
          column: spot.column,
          ownerUserId: object.ownerTwitchId ?? event.userId,
          houseStyle:
            kind === "house"
              ? (object.style ?? event.profile?.houseStyle ?? "tent")
              : null,
          objectId: object.id,
          sprite: null,
        };
        townAdditions.push(addition);
        const tileWidth = app.screen.width / townMap[0].length;
        const tileHeight = app.screen.height / townMap.length;
        addition.sprite =
          kind === "house"
            ? addHouse(
                spot.row,
                spot.column,
                tileWidth,
                tileHeight,
                addition.houseStyle,
                addition.ownerUserId,
              )
            : addTree(spot.row, spot.column, tileWidth, tileHeight);
        addition.sprite.scale.set(0.55);
        addition.sprite.alpha = 0.1;
        const label = makeEffectLabel(`Welcome, ${event.displayName}!`, 18);
        const baseY = (spot.row + 1) * tileHeight - tileHeight * 1.3;
        label.position.set((spot.column + 0.5) * tileWidth, baseY);
        effectLayer.addChild(label);
        activeEffect = {
          type: "follow",
          elapsed: 0,
          duration: 1_500,
          addition,
          label,
          labelStartY: baseY,
        };
      }

      function chooseDecorationSpot(kind) {
        const blocked = new Set();
        for (let row = 0; row < townMap.length; row += 1) {
          for (let column = 0; column < townMap[row].length; column += 1) {
            const tile = townMap[row][column];
            if (tile === "T") blocked.add(`${row}:${column}`);
            if (tile === "H") {
              for (let offset = -1; offset <= 1; offset += 1) {
                blocked.add(`${row}:${column + offset}`);
              }
            }
          }
        }
        for (const addition of townAdditions) {
          const radius = addition.kind === "house" ? 1 : 0;
          for (let offset = -radius; offset <= radius; offset += 1) {
            blocked.add(`${addition.row}:${addition.column + offset}`);
          }
        }
        for (const key of occupiedTiles) blocked.add(key);
        for (const key of reservedTiles) blocked.add(key);

        const options = [];
        townMap.forEach((row, rowIndex) => {
          [...row].forEach((tile, columnIndex) => {
            if (tile !== "g" || rowIndex < 3) return;
            const radius = kind === "house" ? 1 : 0;
            const cells = Array.from(
              { length: radius * 2 + 1 },
              (_, index) => `${rowIndex}:${columnIndex + index - radius}`,
            );
            if (
              cells.some((key) => blocked.has(key)) ||
              columnIndex - radius < 0 ||
              columnIndex + radius >= row.length
            ) {
              return;
            }
            options.push({ row: rowIndex, column: columnIndex });
          });
        });
        return options.length ? choose(options, Math.random) : null;
      }

      function startSubscriptionEffect(event) {
        const tier = event.tier === "3000" ? 3 : event.tier === "2000" ? 2 : 1;
        const duration = 2_500 + tier * 350;
        const graphics = new Graphics();
        const label = makeEffectLabel(
          `${event.displayName} · Tier ${tier}`,
          24,
        );
        label.position.set(
          app.screen.width / 2,
          Math.max(40, app.screen.height * 0.16),
        );
        effectLayer.addChild(graphics, label);
        const bursts = Array.from({ length: 2 + tier }, (_, index) => ({
          x: app.screen.width * (0.25 + (index * 0.5) / (1 + tier)),
          y: app.screen.height * (0.2 + Math.random() * 0.22),
          delay: index * 0.12,
          color: ["#ffd166", "#9be7c4", "#a9c7ff", "#f2a7d8"][index % 4],
          size: 0.7 + tier * 0.15,
        }));
        activeEffect = {
          type: "sub",
          elapsed: 0,
          duration,
          graphics,
          label,
          bursts,
        };
      }

      function startBitsEffect(event) {
        const amount = Math.max(1, Number(event.amount) || 1);
        const count = Math.min(48, 8 + Math.round(Math.sqrt(amount) * 2));
        const graphics = new Graphics();
        const label = makeEffectLabel(
          `${event.displayName} sent ${amount} bits!`,
          22,
        );
        label.position.set(
          app.screen.width / 2,
          Math.max(38, app.screen.height * 0.12),
        );
        effectLayer.addChild(graphics, label);
        const coins = Math.random() < 0.5;
        const particles = Array.from({ length: count }, () => ({
          x: Math.random() * app.screen.width,
          y: -Math.random() * app.screen.height * 0.6,
          drift: (Math.random() - 0.5) * app.screen.width * 0.12,
          size: 3 + Math.random() * 5,
          color: ["#ffd166", "#ffe7a3", "#92e6c1", "#f2a7d8"][
            Math.floor(Math.random() * 4)
          ],
        }));
        activeEffect = {
          type: "bits",
          elapsed: 0,
          duration: 2_400 + Math.min(1_000, Math.sqrt(amount) * 20),
          graphics,
          label,
          particles,
          coins,
        };
      }

      function drawFireworks(effect, progress) {
        effect.graphics.clear();
        for (const burst of effect.bursts) {
          const local = Math.max(
            0,
            Math.min(1, (progress - burst.delay) / (1 - burst.delay)),
          );
          const fade = (1 - local) * 0.72;
          const radius =
            12 +
            local *
              Math.min(app.screen.width, app.screen.height) *
              0.12 *
              burst.size;
          for (let particle = 0; particle < 14; particle += 1) {
            const angle = (particle / 14) * Math.PI * 2;
            const wobble = 0.9 + ((particle * 13) % 5) * 0.04;
            effect.graphics
              .circle(
                burst.x + Math.cos(angle) * radius * wobble,
                burst.y + Math.sin(angle) * radius * wobble,
                2.5 * burst.size,
              )
              .fill({ color: burst.color, alpha: fade });
          }
        }
      }

      function drawBitsRain(effect, progress) {
        effect.graphics.clear();
        const travel = app.screen.height + 100;
        for (const particle of effect.particles) {
          const y = particle.y + progress * travel;
          const x =
            particle.x +
            Math.sin(progress * Math.PI * 2 + particle.y) * particle.drift;
          const alpha = Math.min(
            0.85,
            Math.max(0, (app.screen.height + 80 - y) / 100),
          );
          if (effect.coins) {
            effect.graphics
              .circle(x, y, particle.size)
              .fill({ color: particle.color, alpha });
            effect.graphics
              .rect(x - particle.size * 0.45, y - 1, particle.size * 0.9, 2)
              .fill({ color: "#9f6b18", alpha: alpha * 0.8 });
          } else {
            effect.graphics
              .rect(x, y, particle.size * 1.3, particle.size * 0.65)
              .fill({ color: particle.color, alpha });
          }
        }
      }

      function makeEffectLabel(message, fontSize) {
        const label = new Text({
          text: message,
          style: {
            fontFamily: "Arial, sans-serif",
            fontSize,
            fontWeight: "bold",
            fill: "#fff8db",
            stroke: { fill: "#18241b", width: 4 },
            dropShadow: {
              color: "#000000",
              alpha: 0.7,
              blur: 3,
              distance: 2,
              angle: Math.PI / 2,
            },
          },
          anchor: { x: 0.5, y: 0.5 },
        });
        return label;
      }

      function finishActiveEffect() {
        if (activeEffect.type === "raid") {
          effectLayer.removeChild(activeEffect.banner);
          activeEffect.banner.destroy({ children: true });
          activeEffect = null;
          return;
        }
        if (activeEffect.type !== "follow") {
          effectLayer.removeChild(activeEffect.graphics);
          activeEffect.graphics.destroy();
        }
        effectLayer.removeChild(activeEffect.label);
        activeEffect.label.destroy();
        activeEffect = null;
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      app.ticker.add((ticker) => {
        updateCharacters(ticker.elapsedMS);
        updateEffects(ticker.elapsedMS);
        updateLevelupCelebrations(ticker.elapsedMS);
        updateDayNight(ticker.elapsedMS);
        updateDebugOverlay(ticker.elapsedMS);
      });

      function hashUsername(username) {
        let hash = 2_166_136_261;
        for (let index = 0; index < username.length; index += 1) {
          hash ^= username.charCodeAt(index);
          hash = Math.imul(hash, 16_777_619);
        }
        return hash >>> 0;
      }

      function createSeededRandom(seed) {
        let state = seed || 1;
        return () => {
          state ^= state << 13;
          state ^= state >>> 17;
          state ^= state << 5;
          return (state >>> 0) / 4_294_967_296;
        };
      }

      function choose(values, random) {
        return values[Math.floor(random() * values.length)];
      }

      const initialReconnectDelayMs = 500;
      const maximumReconnectDelayMs = 30_000;
      let reconnectAttempts = 0;

      function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${protocol}//${window.location.host}`);

        socket.addEventListener("open", () => {
          reconnectAttempts = 0;
          console.info("[Chat Town overlay] WebSocket connected");
        });

        socket.addEventListener("message", (message) => {
          try {
            const event = JSON.parse(message.data);
            console.log("[Chat Town overlay] event", event);
            if (
              typeof event.userId === "string" &&
              event.profile &&
              typeof event.profile === "object"
            ) {
              applyViewerProfile(event.userId, event.profile);
            }
            if (
              event.type === "levelup" &&
              typeof event.displayName === "string" &&
              Number.isInteger(event.level)
            ) {
              showLevelupCelebration(event);
            } else if (
              event.type === "chat" &&
              typeof event.displayName === "string" &&
              typeof event.message === "string" &&
              event.message.trim().length > 0 &&
              event.blocked !== true
            ) {
              const userId =
                typeof event.userId === "string" && event.userId.trim()
                  ? event.userId.trim()
                  : event.displayName.trim().toLowerCase();
              let character = characters.get(userId);
              if (!character)
                character = spawnCharacter(event.displayName, userId);
              if (character) {
                if (character.state === "despawning") {
                  character.state = "idle";
                  character.stateTimer = randomBetween(500, 1800);
                  character.sprite.alpha = 1;
                }
                character.lastChatAt = Date.now();
                if (!isActionMessage(event.message)) {
                  showSpeechBubble(character, event.message);
                }
              }
            } else if (
              event.type === "action" &&
              typeof event.displayName === "string" &&
              typeof event.userId === "string" &&
              ["dance", "jump", "wave", "sit"].includes(event.action)
            ) {
              let character = characters.get(event.userId);
              if (!character) {
                character = spawnCharacter(event.displayName, event.userId);
              }
              if (character) {
                if (character.state === "walking" && character.target) {
                  reservedTiles.delete(character.target.key);
                  character.target = null;
                  character.state = "pause";
                  character.stateTimer = 2_000;
                }
                character.action = event.action;
                character.actionElapsed = 0;
                character.graphics.y = 0;
                character.graphics.rotation = 0;
                character.graphics.scale.set(1);
                renderCharacter(character);
              }
            } else if (
              ["follow", "sub", "bits", "raid"].includes(event.type) &&
              typeof event.displayName === "string"
            ) {
              queueEffect(event);
            } else if (
              event.type === "scene" &&
              (event.scene === "day" || event.scene === "night")
            ) {
              setScene(event.scene);
            } else if (event.type === "control") {
              if (event.command === "panic") {
                panicMode = true;
                app.canvas.style.visibility = "hidden";
                debugOverlay.style.display = "none";
              } else if (event.command === "restore") {
                panicMode = false;
                app.canvas.style.visibility = "visible";
                debugOverlay.style.display = debugEnabled ? "block" : "none";
              } else if (
                event.command === "remove-character" &&
                typeof event.displayName === "string"
              ) {
                const username = event.displayName.trim().toLowerCase();
                const character = [...characters.values()].find(
                  (candidate) =>
                    candidate.appearance.username.trim().toLowerCase() ===
                    username,
                );
                if (character) beginDespawn(character);
              }
            }
          } catch (error) {
            console.warn("[Chat Town overlay] received invalid JSON", error);
          }
        });

        socket.addEventListener("close", () => {
          const delay = Math.min(
            initialReconnectDelayMs * 2 ** reconnectAttempts,
            maximumReconnectDelayMs,
          );
          reconnectAttempts = Math.min(reconnectAttempts + 1, 10);
          console.warn(`[Chat Town overlay] reconnecting in ${delay}ms`);
          window.setTimeout(connect, delay);
        });

        socket.addEventListener("error", (error) => {
          console.error("[Chat Town overlay] WebSocket error", error);
          socket.close();
        });
      }

      function isActionMessage(message) {
        return /^!(dance|jump|wave|sit)$/i.test(message.trim());
      }

      connect();
    </script>
  </body>
</html>
